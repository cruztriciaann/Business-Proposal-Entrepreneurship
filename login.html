<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TOKI — Sign In</title>
  <link rel="stylesheet" href="toki.css" />
</head>
<body>
<div class="bg-scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="login-page">
  <div class="login-box">
    <button class="login-theme-toggle" onclick="toggleLoginTheme()" aria-label="Toggle theme">
      <i class="ti ti-sun" id="login-theme-icon"></i>
    </button>

    <div class="login-logo">
      <div class="logo-icon">
        <img src="icon.png" alt="TOKI" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'ti ti-clock\'></i>'"/>
      </div>
      <div>
        <div class="logo-text"><span class="logo-accent">TOKI</span></div>
        <div class="logo-sub">Timing is Everything</div>
      </div>
    </div>

    <!-- Role tabs -->
    <div class="role-tabs" id="role-tabs">
      <button class="role-tab active" onclick="switchRole('student', this)">
        <i class="ti ti-school"></i> Student
      </button>
      <button class="role-tab" onclick="switchRole('organizer', this)">
        <i class="ti ti-microphone"></i> Organizer
      </button>
    </div>

    <div id="login-error" class="login-error"></div>

    <div class="form-group">
      <label class="form-label" for="login-id" id="id-label">Student Number</label>
      <input
        type="text"
        class="form-input"
        id="login-id"
        placeholder="e.g. 2021-00101"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') doLogin()"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="login-pass">Password</label>
      <input
        type="password"
        class="form-input"
        id="login-pass"
        placeholder="Enter password"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') doLogin()"
      />
    </div>

    <button class="btn btn-primary btn-full" onclick="doLogin()" style="margin-bottom:20px;">
      <i class="ti ti-login"></i> Sign In
    </button>

    <!-- Demo quick-fill section -->
    <div class="divider">Quick Demo Access</div>

    <div class="demo-section" id="demo-section">
      <!-- Populated by JS -->
    </div>

    <div style="margin-top:16px;padding:10px 14px;background:var(--glass);border:1px solid var(--border2);border-radius:var(--r-sm);font-size:11px;color:var(--text3);line-height:1.6;">
      <strong style="color:var(--text2);">Demo passwords:</strong><br>
      Students: <code style="font-family:var(--font-mono);color:var(--matcha);">stu123</code> &nbsp;|&nbsp;
      Organizers: <code style="font-family:var(--font-mono);color:var(--strawberry);">org123</code>
    </div>
  </div>
</div>

<script src="shared-state.js"></script>
<script>
  let currentRole = 'student';

  // Theme init
  (function() {
    const t = localStorage.getItem('toki_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('login-theme-icon').className = t === 'light' ? 'ti ti-moon' : 'ti ti-sun';
  })();

  function toggleLoginTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('toki_theme', next);
    document.getElementById('login-theme-icon').className = next === 'light' ? 'ti ti-moon' : 'ti ti-sun';
  }

  function switchRole(role, btn) {
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('id-label').textContent = role === 'student' ? 'Student Number' : 'Staff ID';
    document.getElementById('login-id').placeholder = role === 'student' ? 'e.g. 2021-00101' : 'e.g. ORG-001';
    document.getElementById('login-error').style.display = 'none';
    renderDemo(role);
  }

  function renderDemo(role) {
    const users = TOKI.DEMO_USERS.filter(u => u.role === role);
    const section = document.getElementById('demo-section');
    section.innerHTML = users.map(u => `
      <div class="demo-row" onclick="quickFill('${u.id}', '${u.role === 'student' ? 'stu123' : 'org123'}')">
        <div>
          <div class="demo-name">${u.name}</div>
          <div class="demo-creds">${u.id} &nbsp;·&nbsp; ${u.role === 'student' ? u.course : u.dept}</div>
        </div>
        <div class="demo-use"><i class="ti ti-arrow-right"></i> Use</div>
      </div>`).join('');
  }

  function quickFill(id, pass) {
    document.getElementById('login-id').value   = id;
    document.getElementById('login-pass').value = pass;
    doLogin();
  }

  function doLogin() {
    const id   = document.getElementById('login-id').value.trim();
    const pass = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!id || !pass) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }

    const user = TOKI.authenticate(id, pass, currentRole);
    if (!user) {
      errEl.textContent = 'Incorrect ID or password. Check the demo accounts below.';
      errEl.style.display = 'block';
      document.getElementById('login-id').classList.add('error');
      document.getElementById('login-pass').classList.add('error');
      return;
    }

    TOKI.setUser(user);
    window.location.href = user.role === 'organizer' ? 'oDashboard.html' : 'sDashboard.html';
  }

  // Remove error state on input
  ['login-id','login-pass'].forEach(id => {
    document.getElementById(id).addEventListener('input', function() {
      this.classList.remove('error');
      document.getElementById('login-error').style.display = 'none';
    });
  });

  renderDemo('student');
</script>
</body>
</html>
